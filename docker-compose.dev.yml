name: jsint-dev

services:
  postgres:
    image: postgres:15
    container_name: jsint-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: jsint
      POSTGRES_PASSWORD: jsint
      POSTGRES_DB: jsint
    ports:
      - "5433:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    networks:
      - jsint_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsint"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: jsint-redis-dev
    ports:
      - "6379:6379"
    networks:
      - jsint_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: jsint-neo4j-dev
    ports:
      - "7474:7474" # Web UI
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data_dev:/data
      - neo4j_logs_dev:/logs
      - neo4j_import_dev:/var/lib/neo4j/import
      - neo4j_plugins_dev:/plugins
    restart: unless-stopped
    networks:
      - jsint_network
    healthcheck:
      test: cypher-shell -u ${NEO4J_USERNAME} -p ${NEO4J_PASSWORD} "RETURN 1"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: jsint-api/Dockerfile
      target: dev
    container_name: jsint-api-dev
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./jsint-api:/app/jsint-api
      - /app/jsint-api/.venv
      - ./jsint-core:/app/jsint-core
      - ./jsint-types:/app/jsint-types
      - ./jsint-enrichers:/app/jsint-enrichers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATABASE_URL=postgresql://jsint:jsint@postgres:5432/jsint
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
      - MASTER_VAULT_KEY_V1=${MASTER_VAULT_KEY_V1}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jsint_network

  celery:
    build:
      context: .
      dockerfile: jsint-api/Dockerfile
      target: dev
    container_name: jsint-celery-dev
    restart: unless-stopped
    command: celery -A jsint_core.core.celery worker --loglevel=info --pool=threads --concurrency=10
    volumes:
      - ./jsint-api:/app/jsint-api
      - /app/jsint-api/.venv
      - ./jsint-core:/app/jsint-core
      - ./jsint-types:/app/jsint-types
      - ./jsint-enrichers:/app/jsint-enrichers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATABASE_URL=postgresql://jsint:jsint@postgres:5432/jsint
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MASTER_VAULT_KEY_V1=${MASTER_VAULT_KEY_V1}
      - REDIS_URL=redis://redis:6379/0
      - SKIP_MIGRATIONS=true
      - AUTH_SECRET=${AUTH_SECRET}
    healthcheck:
      # Celery has no HTTP server — Dockerfile's curl-based healthcheck always fails.
      # Use celery's own ping primitive instead.
      test: ["CMD-SHELL", "celery -A jsint_core.core.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - jsint_network

  app:
    build:
      context: ./jsint-app
      dockerfile: Dockerfile.dev
    container_name: jsint-app-dev
    ports:
      - "5173:5173"
    volumes:
      - ./jsint-app:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_REPO_URL=${VITE_REPO_URL:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jsint_network
    stdin_open: true
    tty: true

networks:
  jsint_network:
    name: jsint_network_dev
    driver: bridge

volumes:
  pg_data_dev:
  neo4j_data_dev:
  neo4j_logs_dev:
  neo4j_import_dev:
  neo4j_plugins_dev:
